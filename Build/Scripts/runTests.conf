# Configuration for the shared test runner (netresearch/typo3-ci-workflows).
#
# The e2e_provision_* hooks are the extension-specific half of an e2e run. The
# generic half (MariaDB, a composer-installed TYPO3, PHP-FPM, Apache and the
# checks that each came up) is in the runner's e2e-provision.sh.

PROJECT_LABEL="universal_messenger"

# The Playwright suite, its package.json and its lockfile live here, not at
# the repository root: the root has no other Node tooling.
E2E_TEST_DIR="Tests/E2E"

# No frontend rendering is under test (this extension is a backend module),
# so no e2e_provision_typoscript() hook: the runner writes its own minimal
# page object, which is all provisioning needs to see a 200 from the
# frontend sanity check.

# Backend-module fixtures: two newsletter channels and one newsletter page
# configured for the first of them, plus wiring the admin user (created by
# TYPO3's own `setup` command, before this hook runs) to have permission for
# BOTH channels. That combination (a page's own channel differs from a
# channel the user is separately permitted for) is exactly the GH-139 IDOR
# regression, submitting the OTHER permitted channel for this page must
# still be rejected. Also writes the extension's own configuration into
# additional.php, which the shared provisioning script does not know about.
e2e_provision_seed() {
    if ! cat >> "${E2E_ROOT}/config/system/additional.php" << 'PHP'

// universal_messenger extension configuration (E2E test values only, never
// hit for the IDOR regression itself: the authorization guard runs before
// any webservice call, so an unreachable apiUrl does not affect that test).
$GLOBALS['TYPO3_CONF_VARS']['EXTENSIONS']['universal_messenger'] = [
    'apiUrl'          => 'https://example.invalid/p',
    'apiKey'          => 'e2e-test-key',
    'apiSecret'       => 'e2e-test-secret',
    'enableLogging'   => '0',
    'newsletter'      => [
        'liveChannelSuffix' => '_Live',
        'testChannelSuffix' => '_Test',
    ],
    'newsletterPageDokType' => '20',
    'storagePageId'         => '1',
];
PHP
    then
        echo "e2e_provision_seed: failed to write additional.php" >&2
        return 1
    fi

    ${CONTAINER_BIN} run ${CONTAINER_COMMON_PARAMS} --name e2e-seed-${SUFFIX} \
        -v "${E2E_ROOT}:/var/www/html" \
        -v "${ROOT_DIR}:/extension:ro" \
        -w /var/www/html \
        ${IMAGE_PHP} php /extension/Tests/E2E/Fixtures/seed-content.php
}
