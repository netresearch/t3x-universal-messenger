name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# A new push to a pull request cancels the run for the push before it, so
# superseded test matrices stop taking runners. Runs on main, in the merge
# queue and on the schedule are never cancelled. The group sits here in the
# caller, not in the reusable workflow: a caller that invokes ci.yml twice
# would otherwise put both calls in one group and cancel one with the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Per-extension test matrix (intentional-drift). Security/quality jobs are in checks.yml.
jobs:
  ci:
    uses: netresearch/typo3-ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2","8.3","8.4","8.5"]'
      typo3-versions: '["^14.3"]'
      run-functional-tests: true
      run-acceptance-tests: true
      functional-test-db: 'sqlite'
      upload-coverage: true
      coverage-tool: 'xdebug'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # E2E (Playwright) backend-module regression tests. Single TYPO3 14 target,
  # no setup-variants matrix (this extension needs no fluid_styled_content /
  # sitepackage combinations). setup-script owns provisioning via
  # Build/Scripts/runTests.conf's e2e_provision_* hooks, so the same fixtures
  # run locally (./Build/Scripts/runTests.sh -s e2e) and in CI.
  e2e:
    uses: netresearch/typo3-ci-workflows/.github/workflows/e2e.yml@main
    permissions:
      contents: read
    with:
      setup-script: 'Build/Scripts/ci-e2e.sh'
      artifact-path: 'Tests/E2E/playwright-report/'
      timeout-minutes: 20
